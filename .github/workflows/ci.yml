name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f pyproject.toml
          test -f uv.lock
          test -f databricks.yml

      - name: Validate documentation structure
        run: |
          test -f docs/architecture/architecture-overview.md
          test -f docs/architecture/repository-structure.md
          test -f docs/roadmap/roadmap.md
          test -f docs/engineering/coding-standards.md
          test -f docs/engineering/development-workflow.md
          test -f docs/engineering/branching-strategy.md

      - name: Validate GitHub configuration
        run: |
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .github/dependabot.yml
          test -f .pre-commit-config.yaml

      - name: Validate deployment configuration
        run: |
          test -f configs/dev.yaml
          test -f configs/prod.yaml
          test -f configs/metadata/sources.yaml
          test -f resources/schemas/bronze.schema.yml
          test -f resources/schemas/silver.schema.yml
          test -f resources/schemas/gold.schema.yml
          test -f resources/schemas/quarantine.schema.yml


  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Ruff lint
        run: |
          uv run --frozen ruff check .

      - name: Ruff format
        run: |
          uv run --frozen ruff format --check .

      - name: MyPy
        run: |
          uv run --frozen mypy src

      - name: Run tests
        run: |
          uv run --frozen pytest -v

      - name: Pre-commit
        run: |
          uv run --frozen pre-commit run --all-files
