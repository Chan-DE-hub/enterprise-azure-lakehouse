bundle:
  name: enterprise-azure-lakehouse

include:
  - resources/*.yml
  - resources/**/*.yml

artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

targets:
  dev:
    mode: development
    default: true

    workspace:
      profile: DEFAULT

  prod:
    mode: production

    workspace:
      profile: DEFAULT
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    resources:
      schemas:
        bronze:
          name: prod_bronze

        silver:
          name: prod_silver

        gold:
          name: prod_gold

        quarantine:
          name: prod_quarantine
