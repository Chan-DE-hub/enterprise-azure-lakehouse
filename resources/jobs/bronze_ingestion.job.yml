resources:
  jobs:
    bronze_ingestion:
      name: "Enterprise Lakehouse - Bronze Ingestion"

      tasks:
        - task_key: run_bronze_ingestion
          environment_key: default
          spark_python_task:
            python_file: ../../src/enterprise_lakehouse/jobs/bronze_job.py
            parameters:
              - "--source-id"
              - "sales_orders"
              - "--metadata-path"
              - "/Volumes/dev/config/sources.yml"
              - "--environment"
              - "dev"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
