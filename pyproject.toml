[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_lakehouse"]

[project]
name = "enterprise-azure-lakehouse"
version = "0.1.0"
description = "Production-style Azure Databricks Lakehouse portfolio demonstrating metadata-driven engineering, Medallion Architecture, Unity Catalog, and modern data engineering practices."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

authors = [
    { name = "Christian Evangelista" }
]

keywords = [
    "azure",
    "databricks",
    "lakehouse",
    "spark",
    "delta-lake",
    "unity-catalog",
    "data-engineering",
    "etl",
    "elt"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_functions = [
    "test_*"
]

addopts = "-ra"

[tool.ruff]

line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache"
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

[tool.mypy]

python_version = "3.12"

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = true

disallow_incomplete_defs = true

check_untyped_defs = true

no_implicit_optional = true

strict_equality = true

pretty = true

exclude = [
    "^tests/fixtures/"
]

[tool.coverage.run]

source = [
    "src"
]

branch = true

[tool.coverage.report]

show_missing = true

skip_covered = false
