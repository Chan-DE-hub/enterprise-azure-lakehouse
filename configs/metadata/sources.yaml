sources:
  - source_id: sales_orders

    source_system: sales

    source_type: file

    load_type: incremental

    enabled: true

    priority: 100

    primary_keys:
      - order_id

    watermark_column: modified_at

    file_format: json

    location:
      object_name: orders
      path: /Volumes/dev/landing/orders

    target:
      catalog_name: dev_sales_lakehouse
      bronze_table: bronze_orders
      silver_table: silver_orders
      checkpoint_path: /Volumes/dev/checkpoints/orders
      schema_location_path: /Volumes/dev/schema/orders

    governance:
      business_domain: sales
      owner: data-platform
